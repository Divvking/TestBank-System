spring.application.name=testbank-api
server.port=8081

# PostgreSQL — override with env vars in production:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/testbank_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA — validate: Hibernate never alters schema; DDL is managed by schema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Enable JPA pagination in repositories
spring.data.web.pageable.default-page-size=50
spring.data.web.pageable.max-page-size=200

# SQL init — schema.sql (tables) runs first, then procedures.sql (functions/views), then data.sql (seed)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# JWT — MUST be overridden via JWT_SECRET env var in production
# The default below is for local dev only and is NOT safe to use anywhere else.
jwt.secret=${JWT_SECRET:local-dev-only-jwt-secret-change-me-before-any-real-deployment}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# CORS — override with CORS_ALLOWED_ORIGINS env var in production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging
logging.level.com.testbank=INFO
logging.level.org.springframework.security=WARN
